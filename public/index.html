<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGF · Reggio Emilia</title>
<meta name="robots" content="noindex">
<style>html{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}a{color:#0071e3;margin:0 .6em}body{display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}</style>
<script>
  // 按浏览器语言跳转：意大利语 > 中文 > 英文，都不是就用意大利语（相对路径，子路径部署也能用）
  (function () {
    var langs = navigator.languages || [navigator.language || "it"];
    var pick = "it";
    for (var i = 0; i < langs.length; i++) {
      var b = String(langs[i]).toLowerCase().split("-")[0];
      if (b === "it" || b === "zh" || b === "en") { pick = b; break; }
    }
    location.replace("./" + pick + "/" + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./it/"></noscript>
</head>
<body><p><a href="./it/">Italiano</a><a href="./en/">English</a><a href="./zh/">中文</a></p></body>
</html>
